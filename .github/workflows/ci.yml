name: CI

on:
  pull_request:
  push:
    branches: [main, 'task/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LARAVEL_BYPASS_ENV_CHECK: '1'
      TABULAR_AI_MOCK: 'true'
      TABULAR_SSE_PACING_MS: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl, fileinfo
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: composer validate
        run: composer validate --strict

      - name: composer audit
        run: composer audit --no-interaction

      - name: Pint code style check
        run: vendor/bin/pint --test

      - name: Prepare app env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: npm install
        # `npm ci` is intentionally avoided: the lockfile is generated on
        # Windows (dev) and omits Linux-only optional native deps (e.g.
        # @emnapi/core, a transitive of Vite 8 / rolldown bindings), which
        # makes `npm ci` fail with "Missing ... from lock file" on Linux CI.
        # `npm install` resolves the correct per-platform optional deps.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Vite build
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright (chromium)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi

      - name: Playwright e2e
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
